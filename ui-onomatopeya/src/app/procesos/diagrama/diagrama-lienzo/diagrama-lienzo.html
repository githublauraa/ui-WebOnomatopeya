<div class="desplazable"><div class="lienzo-pool" [style.width.px]="anchoLienzo()" [style.height.px]="altoLienzo()">
  @for (lane of lanes; track lane.id) { <section class="lane-lienzo" [style.top.px]="posicionLane(lane)" [style.height.px]="lane.altura"><div class="cabecera-lane"><h4>{{ lane.nombre }}</h4><div><button type="button" class="btn btn-sm btn-outline-secondary" (click)="editarLane.emit(lane)">Editar</button><button type="button" class="btn btn-sm btn-outline-danger ms-1" (click)="retirarLane.emit(lane)">Retirar</button></div></div></section> }
  <svg class="arcos-lienzo" [attr.viewBox]="'0 0 ' + anchoLienzo() + ' ' + altoLienzo()" [attr.width]="anchoLienzo()" [attr.height]="altoLienzo()"><defs><marker [attr.id]="'flecha-' + pool.id" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 z"></path></marker></defs>@for (arco of arcos; track arco.id) { <line class="arco" [attr.x1]="centroX(arco.origenId)" [attr.y1]="centroY(arco.origenId)" [attr.x2]="centroX(arco.destinoId)" [attr.y2]="centroY(arco.destinoId)" [attr.marker-end]="'url(#flecha-' + pool.id + ')'" /> @if (arco.etiqueta) { <text class="etiqueta-arco" [attr.x]="puntoMedioX(arco)" [attr.y]="puntoMedioY(arco) - 8">{{ arco.etiqueta }}</text> } }</svg>
  @for (nodo of nodos; track nodo.id) { <article class="nodo nodo-lienzo" [class.gateway]="nodo.clase === 'GATEWAY'" [class.evento]="nodo.clase === 'EVENTO'" [style.left.px]="nodo.posicionX" [style.top.px]="nodo.posicionY" [style.width.px]="nodo.ancho" [style.height.px]="nodo.alto"><strong>{{ nodo.nombre }}</strong><span>{{ nodo.clase }}</span><div class="acciones-nodo"><button type="button" class="btn btn-sm btn-outline-secondary" (click)="editarNodo.emit(nodo)">Editar</button><button type="button" class="btn btn-sm btn-outline-danger" (click)="retirarNodo.emit(nodo)">Retirar</button></div></article> }
</div></div>
@if (arcos.length > 0) { <div class="lista-arcos-pool"><h4>Arcos del pool</h4>@for (arco of arcos; track arco.id) { <div class="control-arco"><span>{{ nombreNodo(arco.origenId) }} → {{ nombreNodo(arco.destinoId) }}</span><div><button type="button" class="btn btn-sm btn-outline-secondary" (click)="editarArco.emit(arco)">Editar</button><button type="button" class="btn btn-sm btn-outline-danger ms-1" (click)="retirarArco.emit(arco)">Retirar</button></div></div> }</div> }
