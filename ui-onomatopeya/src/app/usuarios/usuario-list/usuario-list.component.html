<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Gestión de Usuarios — Proyecto Onomatopeya</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrear">
      + Nuevo Usuario
    </button>
  </div>

  <!-- Formulario de Registro Rápido -->
  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <h5 class="card-title mb-3">Registrar Usuario</h5>
      <form (ngSubmit)="guardarUsuario()" class="row g-3">
        <div class="col-md-5">
          <input type="text" class="form-control" placeholder="Nombre completo" [(ngModel)]="nuevoUsuario.nombre" name="nombre" required>
        </div>
        <div class="col-md-5">
          <input type="email" class="form-control" placeholder="Correo electrónico" [(ngModel)]="nuevoUsuario.email" name="email" required>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-success w-100">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla de Resultados -->
  <div class="card shadow-sm">
    <div class="card-body">
      <div *ngIf="cargando" class="text-center my-3">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Cargando datos del servidor Spring Boot...</p>
      </div>

      <table *ngIf="!cargando" class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Estado</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of usuarios">
            <td>{{ u.id }}</td>
            <td><strong>{{ u.nombre }}</strong></td>
            <td>{{ u.email }}</td>
            <td><span class="badge bg-success">{{ u.estado || 'ACTIVO' }}</span></td>
            <td class="text-center">
              <button (click)="eliminar(u.id)" class="btn btn-sm btn-outline-danger">Eliminar</button>
            </td>
          </tr>
          <tr *ngIf="usuarios.length === 0">
            <td colspan="5" class="text-center text-muted py-3">No hay usuarios registrados en la base de datos.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
